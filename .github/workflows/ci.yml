name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (syntax & undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      # Minimal high-signal ruleset: syntax errors (E9) and undefined
      # names (F82). The full ruff config in pyproject.toml reports ~7k
      # legacy violations; enable it once the codebase is cleaned up.
      - name: Run ruff
        run: ruff check --select E9,F63,F7,F82 src tests scripts main.py

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -q
